      name="description"
      content="大学物理实验小助手：实验数据记录、处理、拟合、不确定度与结果表达；公式与通用计算工作台。数据仅保存在本地浏览器。"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23128576'/%3E%3Cstop offset='1' stop-color='%230a5d53'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='28' r='9' stroke='%23ffffff' stroke-opacity='.95' stroke-width='3' fill='none'/%3E%3Ccircle cx='32' cy='28' r='16.5' stroke='%23ffffff' stroke-opacity='.6' stroke-width='2.7' fill='none'/%3E%3Ccircle cx='32' cy='28' r='23.5' stroke='%23ffffff' stroke-opacity='.3' stroke-width='2.4' fill='none'/%3E%3Cpath d='M5 42 Q11 33 17 42 T29 42 T41 42 T53 42 T59 42' stroke='%23ffd166' stroke-width='3.4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='28' r='3' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <title>物理实验小助手</title>
    <script>
      // 首帧前应用主题，避免闪烁。设置持久化在 localStorage 'pea.settings'（zustand persist）。
      (function () {
        try {
          var mode = 'system';
          var raw = localStorage.getItem('pea.settings');
          if (raw) {
            var parsed = JSON.parse(raw);
            var t = parsed && parsed.state && parsed.state.theme;
            if (t === 'light' || t === 'dark' || t === 'system') mode = t;
          }
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
