<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="大学物理实验小助手：实验数据记录、处理、拟合、不确定度与结果表达；公式与通用计算工作台。数据仅保存在本地浏览器。"
    />
    <title>物理实验小助手</title>
    <script>
      // 首帧前应用主题，避免闪烁。设置持久化在 localStorage 'pea.settings'（zustand persist）。
      (function () {
        try {
          var mode = 'system';
          var raw = localStorage.getItem('pea.settings');
          if (raw) {
            var parsed = JSON.parse(raw);
            var t = parsed && parsed.state && parsed.state.theme;
            if (t === 'light' || t === 'dark' || t === 'system') mode = t;
          }
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
